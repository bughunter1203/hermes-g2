<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 1024x1024 is the size the Hub actually stores for the background layer
       (verified against two live listings). The screenshot is composited on top,
       so this stays dark and nearly empty — anything busy fights the green text. -->
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141414"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#field)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.08">
    <polyline points="700,470 800,570 700,670"/>
  </g>
  <rect x="836" y="640" width="110" height="34" rx="17" fill="#FFFFFF" opacity="0.08"/>
</svg>
